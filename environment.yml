name: cxr-vlm-interp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - tqdm
  - ipykernel
  - jupyterlab
  - scikit-learn
  - scipy
  - joblib
  - psutil
  - matplotlib
  - seaborn
  - pillow
  - h5py
  - pip:
      - "transformers>=5.8,<5.10"
      - "accelerate>=1.4,<2"
      - "datasets>=4.7,<5"
      - peft==0.19.1
      - trl==1.4.0
      - "huggingface-hub>=1,<2"
      - safetensors
      - sentencepiece
      - protobuf
      - radgraph==0.1.18
      - f1chexbert==0.0.2
      - --extra-index-url https://download.pytorch.org/whl/cu129
      - torch==2.11.0+cu129
      - torchvision==0.26.0+cu129
      - torchaudio==2.11.0+cu129
      - 'vllm @ https://github.com/vllm-project/vllm/releases/download/v0.22.0/vllm-0.22.0%2Bcu129-cp38-abi3-manylinux_2_28_x86_64.whl ; sys_platform == "linux" and platform_machine == "x86_64"'
